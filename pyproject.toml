[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mia-assistant"
version = "0.1.0"
description = "Mia: local-first personal AI assistant built on a ten-layer SPS framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "psutil>=6,<8",
]
gateway = [
  "httpx>=0.27,<1",
]
credentials = [
  "keyring>=25,<27",
]
voice = [
  "faster-whisper>=1.1,<2",
]
tts = [
  "pyttsx3>=2.99,<3",
]
voice-wake = [
  "openwakeword>=0.6,<1",
]
monitoring = [
  "psutil>=6,<8",
]
computer = [
  "playwright>=1.48,<2",
  "psutil>=6,<8",
  'pywinauto>=0.6.9,<1; platform_system == "Windows"',
]
documents = [
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
]

[project.scripts]
mia = "mia.__main__:main"
mia-credentials = "mia.credentials_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mia.observatory" = ["dashboard.html", "assistant.html", "memory.html"]
"mia.brain" = ["diagnostics.html"]
"mia.life" = ["life.html"]
"mia.gateway" = ["dashboard.html"]
"mia.codegraph" = ["graph.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
