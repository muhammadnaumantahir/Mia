name: Mia CI

on:
  push:
    branches: [main, development/complete-product-gaps, 'integration/**']
  pull_request:
    branches: [main, development/complete-product-gaps]

permissions:
  contents: read

concurrency:
  group: mia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Refresh Code Graph
        run: python scripts/update_code_graph.py
      - name: Test
        run: pytest
      - name: Upload Code Graph snapshot
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mia-code-graph-${{ github.sha }}
          path: docs/code-graph/graph.json
          if-no-files-found: error
          retention-days: 7
